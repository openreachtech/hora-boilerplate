</style><text x="440.0" y="26" class="t" fill="#1f2328" text-anchor="middle">Re-entrancy — every run decides where the project stands</text><rect x="40" y="84" width="420" height="46" rx="8" class="bx bx-b" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><circle cx="64" cy="107.0" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="64" y="111.0" class="n" fill="#1f2328" text-anchor="middle">0</text><text x="84" y="111.0" class="l" fill="#1f2328" text-anchor="start">fetch, and check whether a hotfix landed on main</text><rect x="40" y="150" width="420" height="46" rx="8" class="bx" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><circle cx="64" cy="173.0" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="64" y="177.0" class="n" fill="#1f2328" text-anchor="middle">1</text><text x="84" y="177.0" class="l" fill="#1f2328" text-anchor="start">does the target version have a spec at all?</text><path d="M250,130 L250,148" class="arr arr-b" fill="none" stroke="#0969da" stroke-width="1.4" marker-end="url(#mb)"/><path d="M462,173.0 L556,173.0" class="arr arr-o" fill="none" stroke="#bc4c00" stroke-width="1.4" marker-end="url(#mo)"/><text x="509" y="166.0" class="xs" fill="#59636e" text-anchor="middle">no</text><rect x="560" y="150" width="280" height="46" rx="8" class="bx bx-o" fill="#fff1e5" stroke="#bc4c00" stroke-width="1"/><text x="700" y="170.0" class="l" fill="#1f2328" text-anchor="middle">/hora-spec</text><text x="700" y="187.0" class="xs" fill="#59636e" text-anchor="middle">writes the spec, in conversation</text><rect x="40" y="216" width="420" height="46" rx="8" class="bx" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><circle cx="64" cy="239.0" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="64" y="243.0" class="n" fill="#1f2328" text-anchor="middle">2</text><text x="84" y="243.0" class="l" fill="#1f2328" text-anchor="start">are all declared repositories present?</tex
-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="402" y="391" class="xs" fill="#59636e" text-anchor="middle">/hora-plan</text><path d="M448,394 L450,394" class="arr arr-b" fill="none" stroke="#0969da" stroke-width="1.4" marker-end="url(#mb)"/><rect x="452" y="372" width="91" height="44" rx="6" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="497" y="391" class="xs" fill="#59636e" text-anchor="middle">/hora-build</text><text x="497" y="404" class="xs" fill="#59636e" text-anchor="middle">機能ごとに1回</text><path d="M543,394 L545,394" class="arr arr-b" fill="none" stroke="#0969da" stroke-width="1.4" marker-end="url(#mb)"/><rect x="547" y="372" width="91" height="44" rx="6" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="592" y="391" class="xs" fill="#59636e" text-anchor="middle">/hora-accept</text><path d="M638,394 L640,394" class="arr arr-b" fill="none" stroke="#0969da" stroke-width="1.4" marker-end="url(#mb)"/><rect x="642" y="372" width="91" height="44" rx="6" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="687" y="391" class="xs" fill="#59636e" text-anchor="middle">マージ</text><path d="M500,436 L500,466" class="arr arr-g" fill="none" stroke="#1a7f37" stroke-width="1.4" marker-end="url(#mg)"/><rect x="250" y="466" width="240" height="62" rx="8" class="bx bx-g" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="370" y="490" class="n code" fill="#1f2328" text-anchor="middle">.hora/</text><text x="370" y="510" class="m" fill="#59636e" text-anchor="middle">状態と、何が走ったかの履歴</text><rect x="510" y="466" width="240" height="62" rx="8" class="bx bx-g" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="630" y="490" class="n" fill="#1f2328" text-anchor="middle">実装リポジトリ</text><text x="630" y="510" class="m" fill="#59636e" text-anchor="middle">コードとテスト、機能を1つずつ</text><path d="M752,373 L818,373 L818,132 L754,132" class="arr arr-p dash" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><text x="838" y="252" class="xs" fill="#59636e" text-anchor="middle" transform="rotate(90 838 252)">仕様の不足は、それを所有するステージへ戻る</text><path d="M248,394 L166,394 L166,146 L128,146" class="arr arr-o dash" fill="none" stroke="#bc4c00" stroke-width="1.4" marker-end="url(#mo)"/><text x="152" y="272" class="xs" fill="#59636e" text-anchor="middle" transform="rotate(-90 152 272)">決まっていないことがあれば止まって尋ねる</text></svg>

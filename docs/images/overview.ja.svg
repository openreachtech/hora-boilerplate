</style><text x="440.0" y="26" class="t" fill="#1f2328" text-anchor="middle">2つの半分：/hora-spec が何を作るかを決め、/hora が作る</text><rect x="40" y="78" width="170" height="62" rx="8" class="bx bx-o" fill="#fff1e5" stroke="#bc4c00" stroke-width="1"/><text x="125" y="105" class="l" fill="#1f2328" text-anchor="middle">製品を</text><text x="125" y="122" class="l" fill="#1f2328" text-anchor="middle">望む人</text><path d="M214,109 L246,109" class="arr arr-o" fill="none" stroke="#bc4c00" stroke-width="1.4" marker-end="url(#mo)"/><text x="125" y="68" class="xs" fill="#59636e" text-anchor="middle">対話</text><rect x="250" y="52" width="500" height="112" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><text x="500" y="78" class="t" fill="#1f2328" text-anchor="middle">/hora-spec</text><text x="500" y="96" class="m" fill="#59636e" text-anchor="middle">何を作るかを決める</text><rect x="262" y="110" width="56" height="40" rx="6" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="290" y="135" class="n" fill="#1f2328" text-anchor="middle">0</text><rect x="322" y="110" width="56" height="40" rx="6" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="350" y="135" class="n" fill="#1f2328" text-anchor="middle">1</text><rect x="382" y="110" width="56" height="40" rx="6" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="410" y="135" class="n" fill="#1f2328" text-anchor="middle">2</text><rect x="442" y="110" width="56" height="40" rx="6" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="470" y="135" class="n" fill="#1f2328" text-anchor="middle">3</text><rect x="502" y="110" width="56" height="40" rx="6" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="530" y="135" class="n" fill="#1f2328" text-anchor="middle">4</text><rect x="562" y="110" width="56" height="40" rx="6" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="590" y="135" class="n" fill="#
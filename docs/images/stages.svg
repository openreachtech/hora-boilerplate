</style><text x="500.0" y="26" class="t" fill="#1f2328" text-anchor="middle">The seven stages of /hora-spec — and going back is normal</text><rect x="17" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#faf5ff" stroke="#8250df" stroke-width="1"/><text x="73.0" y="76" class="n" fill="#1f2328" text-anchor="middle">0</text><text x="73.0" y="102" class="n" fill="#1f2328" text-anchor="middle">Assets and</text><text x="73.0" y="117" class="n" fill="#1f2328" text-anchor="middle">sources</text><text x="73.0" y="138" class="xs" fill="#59636e" text-anchor="middle">what exists —</text><text x="73.0" y="151" class="xs" fill="#59636e" text-anchor="middle">the repositories</text><text x="73.0" y="164" class="xs" fill="#59636e" text-anchor="middle">and the documents</text><path d="M129,118.0 L137,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="139.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="70.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="195.0" y="76" class="n" fill="#1f2328" text-anchor="middle">1</text><text x="195.0" y="102" class="n" fill="#1f2328" text-anchor="middle">Use cases</text><text x="195.0" y="117" class="n" fill="#1f2328" text-anchor="middle">and actors</text><text x="195.0" y="138" class="xs" fill="#59636e" text-anchor="middle">who uses this,</text><text x="195.0" y="151" class="xs" fill="#59636e" text-anchor="middle">and what each</text><text x="195.0" y="164" class="xs" fill="#59636e" text-anchor="middle">completes</text><text x="195.0" y="177" class="xs" fill="#59636e" text-anchor="middle">end to end</text><path d="M251.0,118.0 L259.0,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="261.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="192.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="317.0" y="76" class="n" fill="#1f2328" text-anchor="middle">2</text><text x="317.0" y="102" class="n" fill="#1f2328" text-anchor="middle">The</text><text x="317.0" y="117" class="n" fill="#1f2328" text-anchor="middle">horizon</text><text x="317.0" y="138" class="xs" fill="#59636e" text-anchor="middle">built now,</text><text x="317.0" y="151" class="xs" fill="#59636e" text-anchor="middle">foreseen later,</text><text x="317.0" y="164" class="xs" fill="#59636e" text-anchor="middle">never built</text><path d="M373.0,118.0 L381.0,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="383.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="314.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="439.0" y="76" class="n" fill="#1f2328" text-anchor="middle">3</text><text x="439.0" y="102" class="n" fill="#1f2328" text-anchor="middle">Non-functional</text><text x="439.0" y="117" class="n" fill="#1f2328" text-anchor="middle">requirements</text><text x="439.0" y="138" class="xs" fill="#59636e" text-anchor="middle">how many users,</text><text x="439.0" y="151" class="xs" fill="#59636e" text-anchor="middle">how heavy,</text><text x="439.0" y="164" class="xs" fill="#59636e" text-anchor="middle">how available,</text><text x="439.0" y="177" class="xs" fill="#59636e" text-anchor="middle">how long kept</text><path d="M495.0,118.0 L503.0,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="505.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="436.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="561.0" y="76" class="n" fill="#1f2328" text-anchor="middle">4</text><text x="561.0" y="102" class="n" fill="#1f2328" text-anchor="middle">Data, API</text><text x="561.0" y="117" class="n" fill="#1f2328" text-anchor="middle">and execution</text><text x="561.0" y="138" class="xs" fill="#59636e" text-anchor="middle">the data model,</text><text x="561.0" y="151" class="xs" fill="#59636e" text-anchor="middle">the operations,</text><text x="561.0" y="164" class="xs" fill="#59636e" text-anchor="middle">what runs</text><text x="561.0" y="177" class="xs" fill="#59636e" text-anchor="middle">as a job</text><path d="M617.0,118.0 L625.0,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="627.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="558.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="683.0" y="76" class="n" fill="#1f2328" text-anchor="middle">5</text><text x="683.0" y="102" class="n" fill="#1f2328" text-anchor="middle">Screens and</text><text x="683.0" y="117" class="n" fill="#1f2328" text-anchor="middle">interaction</text><text x="683.0" y="138" class="xs" fill="#59636e" text-anchor="middle">the screens a</text><text x="683.0" y="151" class="xs" fill="#59636e" text-anchor="middle">use case passes</text><text x="683.0" y="164" class="xs" fill="#59636e" text-anchor="middle">through, and</text><text x="683.0" y="177" class="xs" fill="#59636e" text-anchor="middle">what they call</text><path d="M739.0,118.0 L747.0,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="749.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="680.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="805.0" y="76" class="n" fill="#1f2328" text-anchor="middle">6</text><text x="805.0" y="102" class="n" fill="#1f2328" text-anchor="middle">Security</text><text x="805.0" y="123" class="xs" fill="#59636e" text-anchor="middle">who may call</text><text x="805.0" y="136" class="xs" fill="#59636e" text-anchor="middle">each operation,</text><text x="805.0" y="149" class="xs" fill="#59636e" text-anchor="middle">and what</text><text x="805.0" y="162" class="xs" fill="#59636e" text-anchor="middle">happens otherwise</text><path d="M861.0,118.0 L869.0,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="871.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="802.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="927.0" y="76" class="n" fill="#1f2328" text-anchor="middle">7</text><text x="927.0" y="102" class="n" fill="#1f2328" text-anchor="middle">Whole-document</text><text x="927.0" y="117" class="n" fill="#1f2328" text-anchor="middle">review</text><text x="927.0" y="138" class="xs" fill="#59636e" text-anchor="middle">whether the</text><text x="927.0" y="151" class="xs" fill="#59636e" text-anchor="middle">document holds</text><text x="927.0" y="164" class="xs" fill="#59636e" text-anchor="middle">together at all</text><path d="M927.0,236 L69.0,236" class="arr arr-p dash" marker-end="url(#mp)"/><path d="M73.0,236 L73.0,188" class="arr arr-p dash" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><text x="73.0" y="258" class="xs" fill="#59636e" text-anchor="middle">a document or a</text><text x="73.0" y="271" class="xs" fill="#59636e" text-anchor="middle">repository nobody</text><text x="73.0" y="284" class="xs" fill="#59636e" text-anchor="middle">declared</text><path d="M195.0,236 L195.0,188" class="arr arr-p dash" marker-end="url(#mp)"/><text x="195.0" y="258" class="xs" fill="#59636e" text-anchor="middle">a use case nobody</text><text x="195.0" y="271" class="xs" fill="#59636e" text-anchor="middle">stated, or one</text><text x="195.0" y="284" class="xs" fill="#59636e" text-anchor="middle">that is wrong</text><path d="M317.0,236 L317.0,188" class="arr arr-p dash" marker-end="url(#mp)"/><text x="317.0" y="258" class="xs" fill="#59636e" text-anchor="middle">a feature that</text><text x="317.0" y="271" class="xs" fill="#59636e" text-anchor="middle">belongs in a</text><text x="317.0" y="284" class="xs" fill="#59636e" text-anchor="middle">later release</text><path d="M439.0,236 L439.0,188" class="arr arr-p dash" marker-end="url(#mp)"/><text x="439.0" y="258" class="xs" fill="#59636e" text-anchor="middle">a number that</text><text x="439.0" y="271" class="xs" fill="#59636e" text-anchor="middle">makes the</text><text x="439.0" y="284" class="xs" fill="#59636e" text-anchor="middle">design wrong</text><path d="M561.0,236 L561.0,188" class="arr arr-p dash" marker-end="url(#mp)"/><text x="561.0" y="258" class="xs" fill="#59636e" text-anchor="middle">a use case the</text><text x="561.0" y="271" class="xs" fill="#59636e" text-anchor="middle">data model cannot</text><text x="561.0" y="284" class="xs" fill="#59636e" text-anchor="middle">represent</text><path d="M683.0,236 L683.0,188" class="arr arr-p dash" marker-end="url(#mp)"/><text x="683.0" y="258" class="xs" fill="#59636e" text-anchor="middle">a use case with</text><text x="683.0" y="271" class="xs" fill="#59636e" text-anchor="middle">no screen path</text><path d="M805.0,236 L805.0,188" class="arr arr-p dash" marker-end="url(#mp)"/><text x="805.0" y="258" class="xs" fill="#59636e" text-anchor="middle">an operation with</text><text x="805.0" y="271" class="xs" fill="#59636e" text-anchor="middle">no stated caller</text><text x="983" y="216" class="xs" fill="#59636e" text-anchor="end">stage 7 sends each shortfall back to the stage that owns it —</text><text x="983" y="229" class="xs" fill="#59636e" text-anchor="end">it never patches one in place</text><text x="500.0" y="378" class="xs" fill="#59636e" text-anchor="middle">every stage runs in the main session, in conversation — a subagent cannot ask anybody anything, and deciding for the author would be inventing a requirement</text></svg>

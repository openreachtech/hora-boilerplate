</style><text x="440.0" y="26" class="t" fill="#1f2328" text-anchor="middle">Four layers — and not one of them is in this repository</text><text x="144" y="81.0" class="m" fill="#59636e" text-anchor="end">orchestration</text><text x="144" y="173.0" class="m" fill="#59636e" text-anchor="end">order and gates</text><text x="144" y="275.0" class="m" fill="#59636e" text-anchor="end">one section,</text><text x="144" y="289.0" class="m" fill="#59636e" text-anchor="end">one checkpoint</text><text x="144" y="414.0" class="m" fill="#59636e" text-anchor="end">every procedure</text><rect x="164" y="52" width="74" height="62" rx="8" class="bx bx-o" fill="#fff1e5" stroke="#bc4c00" stroke-width="1"/><text x="201" y="89" class="n" fill="#1f2328" text-anchor="middle">you</text><path d="M240,83 L264,83" class="arr arr-o" fill="none" stroke="#bc4c00" stroke-width="1.4" marker-end="url(#mo)"/><rect x="268" y="52" width="592" height="62" rx="8" class="bx bx-b" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="564" y="78" class="t" fill="#1f2328" text-anchor="middle">/hora</text><text x="564" y="97" class="m" fill="#59636e" text-anchor="middle">which phase comes next · every branch, commit and merge</text><rect x="164" y="144" width="132" height="62" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><text x="230" y="172" class="n" fill="#1f2328" text-anchor="middle">/hora-spec</text><text x="230" y="191" class="xs" fill="#59636e" text-anchor="middle">the spec</text><path d="M230,116 L230,142" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="305" y="144" width="132" height="62" rx="8" class="bx bx-b" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="371" y="172" class="n" fill="#1f2328" text-anchor="middle">/hora-setup</text><text x="371" y="191" class="xs" fill="#59636e" text-anchor="middle">the boilerplates</text><path d="M371,116 L371,142" class="arr arr-b" fill="none" stroke="#0969da" stroke-width="1.4" marker-end="url(#mb)"/><rect x="446" y="144" width="132" height="62" rx="8" class="bx bx-b" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="512" y="172" class="n" fill="#1f2328" text-anchor="middle">/hora-plan</text><text x="512" y="191" class="xs" fill="#59636e" text-anchor="middle">the plan</text><path d="M512,116 L512,142" class="arr arr-b" fill="none" stroke="#0969da" stroke-width="1.4" marker-end="url(#mb)"/><rect x="587" y="144" width="132" height="62" rx="8" class="bx bx-b" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="653" y="172" class="n" fill="#1f2328" text-anchor="middle">/hora-build</text><text x="653" y="191" class="xs" fill="#59636e" text-anchor="middle">one feature</text><path d="M653,116 L653,142" class="arr arr-b" fill="none" stroke="#0969da" stroke-width="1.4" marker-end="url(#mb)"/><rect x="728" y="144" width="132" height="62" rx="8" class="bx bx-b" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="794" y="172" class="n" fill="#1f2328" text-anchor="middle">/hora-accept</text><text x="794" y="191" class="xs" fill="#59636e" text-anchor="middle">acceptance</text><path d="M794,116 L794,142" class="arr arr-b" fill="none" stroke="#0969da" stroke-width="1.4" marker-end="url(#mb)"/><rect x="164" y="236" width="336" height="96" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><text x="332" y="260" class="n" fill="#1f2328" text-anchor="middle">seven stage skills</text><text x="332" y="281" class="m" fill="#59636e" text-anchor="middle">hora-spec-usecases … hora-spec-review</text><text x="332" y="297" class="m" fill="#59636e" text-anchor="middle">asks, proposes, writes one approved section</text><text x="332" y="313" class="m" fill="#59636e" text-anchor="middle">never touches git</text><rect x="524" y="236" width="336" height="96" rx="8" class="bx bx-g" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="692" y="260" class="n" fill="#1f2328" text-anchor="middle">two subagents</text><text x="692" y="281" class="m" fill="#59636e" text-anchor="middle">hora-implementer — one checkpoint's code and tests</text><text x="692" y="297" class="m" fill="#59636e" text-anchor="middle">hora-verifier — read-only; it never fixes anything</text><text x="692" y="313" class="m" fill="#59636e" text-anchor="middle">neither touches git, .hora/ or specs/</text><path d="M230,208 L230,234" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><path d="M653,208 L653,234" class="arr arr-g" fill="none" stroke="#1a7f37" stroke-width="1.4" marker-end="url(#mg)"/><rect x="164" y="368" width="696" height="96" rx="8" class="bx" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="512" y="392" class="n code" fill="#1f2328" text-anchor="middle">@openreachtech/hora-skills-ort-core · -ort-renchan · -ort-furo</text><text x="512" y="413" class="m" fill="#59636e" text-anchor="middle">how to actually write a resolver, a migration, a component, a test</text><text x="512" y="429" class="m" fill="#59636e" text-anchor="middle">how to shape a table, an SDL, a job, a screen</text><text x="512" y="445" class="m" fill="#59636e" text-anchor="middle">what acceptance fails on</text><path d="M332,334 L332,366" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><path d="M692,334 L692,366" class="arr arr-g" fill="none" stroke="#1a7f37" stroke-width="1.4" marker-end="url(#mg)"/><text x="512" y="476" class="xs" fill="#59636e" text-anchor="middle">each versioned and updated on its own — a copy inside Hora Kit would go stale, and nothing would announce it</text></svg>

</style><text x="440.0" y="26" class="t" fill="#1f2328" text-anchor="middle">One feature, eighteen checkpoints, four gates</text><circle cx="44" cy="58" r="8" class="bx bx-o" fill="#fff1e5" stroke="#bc4c00" stroke-width="1"/><text x="58" y="62" class="xs" fill="#59636e" text-anchor="start">the main session, in conversation</text><circle cx="256.18" cy="58" r="8" class="bx bx-g" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="270.18" y="62" class="xs" fill="#59636e" text-anchor="start">hora-implementer</text><circle cx="375.54" cy="58" r="8" class="bx bx-r" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/><text x="389.54" y="62" class="xs" fill="#59636e" text-anchor="start">hora-verifier (read-only)</text><rect x="538" y="48" width="22" height="20" rx="5" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="549" y="62" class="xs" fill="#59636e" text-anchor="middle">↩</text><text x="568" y="62" class="xs" fill="#59636e" text-anchor="start">verification gate — can send the run back</text><rect x="36" y="100" width="570" height="102" rx="10" class="bx" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="52" y="120" class="n" fill="#1f2328" text-anchor="start">Spec gate</text><text x="590" y="120" class="xs" fill="#59636e" text-anchor="end">writes specs/ and .hora/ only</text><circle cx="72" cy="145.0" r="12" class="bx bx-o" fill="#fff1e5" stroke="#bc4c00" stroke-width="1"/><text x="72" y="149.0" class="n" fill="#1f2328" text-anchor="middle">1</text><text x="94" y="149.0" class="l" fill="#1f2328" text-anchor="start">Draft or confirm the specification</text><circle cx="72" cy="175.0" r="12" class="bx bx-o" fill="#fff1e5" stroke="#bc4c00" stroke-width="1"/><text x="72" y="179.0" class="n" fill="#1f2328" text-anchor="middle">2</text><text x="94" y="179.0" class="l" fill="#1f2328" text-anchor="start">Verify the use cases can be met</text><rect x="570" y="165.0" width="22" height="20" rx="5" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="581" y="179.0" class="xs" fill="#59636e" text-anchor="middle">↩</text><rect x="36" y="218" width="570" height="252" rx="10" class="bx" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="52" y="238" class="n" fill="#1f2328" text-anchor="start">Backend gate</text><text x="590" y="238" class="xs" fill="#59636e" text-anchor="end">written in the backend row</text><circle cx="72" cy="263.0" r="12" class="bx bx-g" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="72" y="267.0" class="n" fill="#1f2328" text-anchor="middle">3</text><text x="94" y="267.0" class="l" fill="#1f2328" text-anchor="start">DB and API schemas</text><circle cx="72" cy="293.0" r="12" class="bx bx-g" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="72" y="297.0" class="n" fill="#1f2328" text-anchor="middle">4</text><text x="94" y="297.0" class="l" fill="#1f2328" text-anchor="start">Stub API</text><circle cx="72" cy="323.0" r="12" class="bx bx-g" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="72" y="327.0" class="n" fill="#1f2328" text-anchor="middle">5</text><text x="94" y="327.0" class="l" fill="#1f2328" text-anchor="start">The modules the implementation needs</text><circle cx="72" cy="353.0" r="12" class="bx bx-g" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="72" y="357.0" class="n" fill="#1f2328" text-anchor="middle">6</text><text x="94" y="357.0" class="l" fill="#1f2328" text-anchor="start">Actual API</text><circle cx="72" cy="383.0" r="12" class="bx bx-g" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="72" y="387.0" class="n" fill="#1f2328" text-anchor="middle">7</text><text x="94" y="387.0" class="l" fill="#1f2328" text-anchor="start">Worker</text><circle cx="72" cy="413.0" r="12" class="bx bx-r" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/><text x="72" y="417.0" class="n" fill="#1f2328" text-anchor="middle">8</text><text x="94" y="417.0" class="l" fill="#1f2328" text-anchor="start">Security audit</t
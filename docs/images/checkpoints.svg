-anchor="middle">13</text><text x="94" y="625.0" class="l" fill="#1f2328" text-anchor="start">The frontend modules the implementation needs</text><circle cx="72" cy="651.0" r="12" class="bx bx-g" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="72" y="655.0" class="n" fill="#1f2328" text-anchor="middle">14</text><text x="94" y="655.0" class="l" fill="#1f2328" text-anchor="start">API client</text><circle cx="72" cy="681.0" r="12" class="bx bx-g" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="72" y="685.0" class="n" fill="#1f2328" text-anchor="middle">15</text><text x="94" y="685.0" class="l" fill="#1f2328" text-anchor="start">UI</text><circle cx="72" cy="711.0" r="12" class="bx bx-g" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="72" y="715.0" class="n" fill="#1f2328" text-anchor="middle">16</text><text x="94" y="715.0" class="l" fill="#1f2328" text-anchor="start">Wire the data-fetching logic in</text><circle cx="72" cy="741.0" r="12" class="bx bx-o" fill="#fff1e5" stroke="#bc4c00" stroke-width="1"/><text x="72" y="745.0" class="n" fill="#1f2328" text-anchor="middle">17</text><text x="94" y="745.0" class="l" fill="#1f2328" text-anchor="start">Local test environment</text><rect x="36" y="784" width="570" height="72" rx="10" class="bx" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="52" y="804" class="n" fill="#1f2328" text-anchor="start">Acceptance gate</text><text x="590" y="804" class="xs" fill="#59636e" text-anchor="end">writes .hora/acceptance/ only</text><circle cx="72" cy="829.0" r="12" class="bx bx-o" fill="#fff1e5" stroke="#bc4c00" stroke-width="1"/><text x="72" y="833.0" class="n" fill="#1f2328" text-anchor="middle">18</text><text x="94" y="833.0" class="l" fill="#1f2328" text-anchor="start">Acceptance (E2E and unit both)</text><rect x="570" y="819.0" width="22" height="20" rx="5" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="581" y="833.0" class="xs" fill="#59636e" text-anchor="middle">↩</text><path d="M650,263.0 L650,443.0" class="lane-b" fill="none" stroke="#0969da" stroke-width="1"/><path d="M643,263.0 L657,263.0" class="lane-b" fill="none" stroke="#0969da" stroke-width="2"/><path d="M643,443.0 L657,443.0" class="lane-b" fill="none" stroke="#0969da" stroke-width="2"/><path d="M606,263.0 L648,263.0" class="arr arr-b dash" marker-end="url(#mb)"/><text x="662" y="261.0" class="xs" fill="#59636e" text-anchor="start">cut feature/&lt;feature-id&gt;</text><text x="662" y="274.0" class="xs" fill="#59636e" text-anchor="start">in the backend row</text><text x="662" y="447.0" class="xs" fill="#59636e" text-anchor="start">merges when 9 passes</text><path d="M650,531.0 L650,741.0" class="lane-b" fill="none" stroke="#0969da" stroke-width="1"/><path d="M643,531.0 L657,531.0" class="lane-b" fill="none" stroke="#0969da" stroke-width="2"/><path d="M643,741.0 L657,741.0" class="lane-b" fill="none" stroke="#0969da" stroke-width="2"/><path d="M606,531.0 L648,531.0" class="arr arr-b dash" marker-end="url(#mb)"/><text x="662" y="529.0" class="xs" fill="#59636e" text-anchor="start">cut feature/&lt;feature-id&gt;</text><text x="662" y="542.0" class="xs" fill="#59636e" text-anchor="start">in the frontend row</text><text x="662" y="745.0" class="xs" fill="#59636e" text-anchor="start">merges when 17 passes</text><text x="440.0" y="894" class="xs" fill="#59636e" text-anchor="middle">the order is a rule — no checkpoint is entered until every earlier one is [x], and a skipped one is marked n/a with a written reason</text></svg>

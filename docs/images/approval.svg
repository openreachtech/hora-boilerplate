.arr-p{stroke:#ab7df8}
.arr-o{stroke:#f0883e}
.arr-g{stroke:#3fb950}
.ah{fill:#6e7681}
.ah-b{fill:#4493f8}
.ah-p{fill:#ab7df8}
.ah-o{fill:#f0883e}
.ah-g{fill:#3fb950}
.ln{stroke:#3d444d}
.lane{stroke:#6e7681}
.lane-b{stroke:#4493f8}
.lane-g{stroke:#3fb950}

.n{font-size:12.5px;font-weight:600}
.m{font-size:11.5px}
.xs{font-size:10.5px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dash{stroke-dasharray:5 4}

@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.m,.xs{fill:#9198a1}
.bx{fill:#151b23;stroke:#3d444d}
.bx-1{fill:#0d1117;stroke:#3d444d}

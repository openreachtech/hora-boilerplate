<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 252" width="880" height="252" font-family="-apple-system, BlinkMacSystemFont, &#x27;Hiragino Sans&#x27;, &#x27;Noto Sans JP&#x27;, &#x27;Noto Sans CJK JP&#x27;, &#x27;Yu Gothic&#x27;, Meiryo, Helvetica, Arial, sans-serif" role="img" aria-label="承認は節ごと — 行ごとでも、文書ごとでもない"><title>承認は節ごと — 行ごとでも、文書ごとでもない</title><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah" fill="#8b949e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-b" fill="#0969da"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-p" fill="#8250df"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-o" fill="#bc4c00"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-g" fill="#1a7f37"/></marker></defs><style>
.t{font-size:15px;font-weight:600}

}
</style><text x="440.0" y="26" class="t" fill="#1f2328" text-anchor="middle">承認は節ごと — 行ごとでも、文書ごとでもない</text><rect x="12" y="52" width="156" height="92" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="90.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="90.0" y="76" class="n" fill="#1f2328" text-anchor="middle">1</text><text x="90.0" y="102" class="l" fill="#1f2328" text-anchor="middle">ステージが対話し、</text><text x="90.0" y="117" class="l" fill="#1f2328" text-anchor="middle">節を起草する</text><path d="M168,98.0 L189,98.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="193" y="52" width="156" height="92" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="271.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="271.0" y="76" class="n" fill="#1f2328" text-anchor="middle">2</text><text x="271.0" y="102" class="l" fill="#1f2328" text-anchor="middle">書き込む形のまま、</text><text x="271.0" y="117" class="l" fill="#1f2328" text-anchor="middle">節を全文提示する</text><path d="M349,98.0 L370,98.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="374" y="52" width="156" height="92" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="452.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="452.0" y="76" class="n" fill="#1f2328" text-anchor="middle">3</text><text x="452.0" y="102" class="l" fill="#1f2328" text-anchor="middle">どの行が対話から来て、</text><text x="452.0" y="117" class="l" fill="#1f2328" text-anchor="middle">どの行が提案かを言う</text><path d="M530,98.0 L551,98.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="555" y="52" width="156" height="92" rx="8" class="bx bx-o" fill="#fff1e5" stroke="#bc4c00" stroke-width="1"/><circle cx="633.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="633.0" y="76" class="n" fill="#1f2328" text-anchor="middle">4</text><text x="633.0" y="102" class="l" fill="#1f2328" text-anchor="middle">待つ</text><path d="M711,98.0 L732,98.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="736" y="52" width="156" height="92" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="814.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="814.0" y="76" class="n" fill="#1f2328" text-anchor="middle">5</text><text x="814.0" y="102" class="l" fill="#1f2328" text-anchor="middle">承認されたものだけを</text><text x="814.0" y="117" class="l" fill="#1f2328" text-anchor="middle">書き込む</text><path d="M633.0,146 L633.0,196 L90.0,196 L90.0,148" class="arr arr-o dash" fill="none" stroke="#bc4c00" stroke-width="1.4" marker-end="url(#mo)"/><text x="361.5" y="190" class="xs" fill="#59636e" text-anchor="middle">差し戻されたら書き直して再提示 — 「大部分を書いて注記」は無し</text><text x="440.0" y="238" class="xs" fill="#59636e" text-anchor="middle">行ごとでは、承認回数の負担で仕様書が書かれない。文書ごとの1回の「はい」は、誰も読んでいない仕様書 — しかも記録はそう言わない</text></svg>

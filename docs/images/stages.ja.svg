</style><text x="500.0" y="26" class="t" fill="#1f2328" text-anchor="middle">/hora-spec の7つのステージ — そして後戻りは正常</text><rect x="17" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#faf5ff" stroke="#8250df" stroke-width="1"/><text x="73.0" y="76" class="n" fill="#1f2328" text-anchor="middle">0</text><text x="73.0" y="102" class="n" fill="#1f2328" text-anchor="middle">既存資産</text><text x="73.0" y="117" class="n" fill="#1f2328" text-anchor="middle">と出典</text><text x="73.0" y="138" class="xs" fill="#59636e" text-anchor="middle">既にあるもの —</text><text x="73.0" y="151" class="xs" fill="#59636e" text-anchor="middle">リポジトリと</text><text x="73.0" y="164" class="xs" fill="#59636e" text-anchor="middle">文書</text><path d="M129,118.0 L137,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="139.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="70.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="195.0" y="76" class="n" fill="#1f2328" text-anchor="middle">1</text><text x="195.0" y="102" class="n" fill="#1f2328" text-anchor="middle">ユースケース</text><text x="195.0" y="117" class="n" fill="#1f2328" text-anchor="middle">とアクター</text><text x="195.0" y="138" class="xs" fill="#59636e" text-anchor="middle">誰が使い、</text><text x="195.0" y="151" class="xs" fill="#59636e" text-anchor="middle">それぞれが何を</text><text x="195.0" y="164" class="xs" fill="#59636e" text-anchor="middle">最後まで</text><text x="195.0" y="177" class="xs" fill="#59636e" text-anchor="middle">完了するか</text><path d="M251.0,118.0 L259.0,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="261.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="192.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="317.0" y="76" class="n" fill="#1f2328" text-anchor="middle">2</text><text x="317.0" y="102" class="n" fill="#1f2328" text-anchor="middle">スコープ</text><text x="317.0" y="117" class="n" fill="#1f2328" text-anchor="middle">定義</text><text x="317.0" y="138" class="xs" fill="#59636e" text-anchor="middle">今作るもの、</text><text x="317.0" y="151" class="xs" fill="#59636e" text-anchor="middle">後で作るもの、</text><text x="317.0" y="164" class="xs" fill="#59636e" text-anchor="middle">決して</text><text x="317.0" y="177" class="xs" fill="#59636e" text-anchor="middle">作らないもの</text><path d="M373.0,118.0 L381.0,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="383.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="314.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="439.0" y="76" class="n" fill="#1f2328" text-anchor="middle">3</text><text x="439.0" y="102" class="n" fill="#1f2328" text-anchor="middle">非機能要件</text><text x="439.0" y="123" class="xs" fill="#59636e" text-anchor="middle">何人・どれだけ</text><text x="439.0" y="136" class="xs" fill="#59636e" text-anchor="middle">重く・どれだけ</text><text x="439.0" y="149" class="xs" fill="#59636e" text-anchor="middle">止まらず・</text><text x="439.0" y="162" class="xs" fill="#59636e" text-anchor="middle">どれだけ保つか</text><path d="M495.0,118.0 L503.0,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="505.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="436.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="561.0" y="76" class="n" fill="#1f2328" text-anchor="middle">4</text><text x="561.0" y="102" class="n" fill="#1f2328" text-anchor="middle">データ・API</text><text x="561.0" y="117" class="n" fill="#1f2328" text-anchor="middle">・実行配置</text><text x="561.0" y="138" class="xs" fill="#59636e" text-anchor="middle">データモデル、</text><text x="561.0" y="151" class="xs" fill="#59636e" text-anchor="middle">操作一覧、</text><text x="561.0" y="164" class="xs" fill="#59636e" text-anchor="middle">Worker に</text><text x="561.0" y="177" class="xs" fill="#59636e" text-anchor="middle">回す仕事</text><path d="M617.0,118.0 L625.0,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="627.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="558.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="683.0" y="76" class="n" fill="#1f2328" text-anchor="middle">5</text><text x="683.0" y="102" class="n" fill="#1f2328" text-anchor="middle">画面と操作</text><text x="683.0" y="123" class="xs" fill="#59636e" text-anchor="middle">ユースケースが</text><text x="683.0" y="136" class="xs" fill="#59636e" text-anchor="middle">通る画面と、</text><text x="683.0" y="149" class="xs" fill="#59636e" text-anchor="middle">画面が呼ぶ</text><text x="683.0" y="162" class="xs" fill="#59636e" text-anchor="middle">操作</text><path d="M739.0,118.0 L747.0,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="749.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="680.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="805.0" y="76" class="n" fill="#1f2328" text-anchor="middle">6</text><text x="805.0" y="102" class="n" fill="#1f2328" text-anchor="middle">セキュリティ</text><text x="805.0" y="123" class="xs" fill="#59636e" text-anchor="middle">誰が呼べるか、</text><text x="805.0" y="136" class="xs" fill="#59636e" text-anchor="middle">他の人が</text><text x="805.0" y="149" class="xs" fill="#59636e" text-anchor="middle">呼んだら</text><text x="805.0" y="162" class="xs" fill="#59636e" text-anchor="middle">何が起きるか</text><path d="M861.0,118.0 L869.0,118.0" class="arr arr-p" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><rect x="871.0" y="52" width="112" height="132" rx="8" class="bx bx-p" fill="#f3ecff" stroke="#8250df" stroke-width="1"/><circle cx="802.0" cy="72" r="11" class="bx bx-1" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="927.0" y="76" class="n" fill="#1f2328" text-anchor="middle">7</text><text x="927.0" y="102" class="n" fill="#1f2328" text-anchor="middle">全体レビュー</text><text x="927.0" y="123" class="xs" fill="#59636e" text-anchor="middle">文書全体が</text><text x="927.0" y="136" class="xs" fill="#59636e" text-anchor="middle">そもそも</text><text x="927.0" y="149" class="xs" fill="#59636e" text-anchor="middle">整合しているか</text><path d="M927.0,236 L69.0,236" class="arr arr-p dash" marker-end="url(#mp)"/><path d="M73.0,236 L73.0,188" class="arr arr-p dash" fill="none" stroke="#8250df" stroke-width="1.4" marker-end="url(#mp)"/><text x="73.0" y="258" class="xs" fill="#59636e" text-anchor="middle">誰も宣言して</text><text x="73.0" y="271" class="xs" fill="#59636e" text-anchor="middle">いなかった文書や</text><text x="73.0" y="284" class="xs" fill="#59636e" text-anchor="middle">リポジトリ</text><path d="M195.0,236 L195.0,188" class="arr arr-p dash" marker-end="url(#mp)"/><text x="195.0" y="258" class="xs" fill="#59636e" text-anchor="middle">誰も言っていない、</text><text x="195.0" y="271" class="xs" fill="#59636e" text-anchor="middle">あるいは誤って</text><text x="195.0" y="284" class="xs" fill="#59636e" text-anchor="middle">いたユースケース</text><path d="M317.0,236 L317.0,188" class="arr arr-p dash" marker-end="url(#mp)"/><text x="317.0" y="258" class="xs" fill="#59636e" text-anchor="middle">後の版に属する</text><text x="317.0" y="271" class="xs" fill="#59636e" text-anchor="middle">機能</text><path d="M439.0,236 L439.0,188" class="arr arr-p dash" marker-end="url(#mp)"/><text x="439.0" y="258" class="xs" fill="#59636e" text-anchor="middle">設計を誤らせる</text><text x="439.0" y="271" class="xs" fill="#59636e" text-anchor="middle">数値</text><path d="M561.0,236 L561.0,188" class="arr arr-p dash" marker-end="url(#mp)"/><text x="561.0" y="258" class="xs" fill="#59636e" text-anchor="middle">データモデルが</text><text x="561.0" y="271" class="xs" fill="#59636e" text-anchor="middle">表現できない</text><text x="561.0" y="284" class="xs" fill="#59636e" text-anchor="middle">ユースケース</text><path d="M683.0,236 L683.0,188" class="arr arr-p dash" marker-end="url(#mp)"/><text x="683.0" y="258" class="xs" fill="#59636e" text-anchor="middle">画面の経路が</text><text x="683.0" y="271" class="xs" fill="#59636e" text-anchor="middle">無いユースケース</text><path d="M805.0,236 L805.0,188" class="arr arr-p dash" marker-end="url(#mp)"/><text x="805.0" y="258" class="xs" fill="#59636e" text-anchor="middle">呼び手が書かれて</text><text x="805.0" y="271" class="xs" fill="#59636e" text-anchor="middle">いない操作</text><text x="983" y="216" class="xs" fill="#59636e" text-anchor="end">ステージ7 は、不足をそれを所有するステージへ送り返す —</text><text x="983" y="229" class="xs" fill="#59636e" text-anchor="end">その場で継ぎ当てはしない</text><text x="500.0" y="378" class="xs" fill="#59636e" text-anchor="middle">7つのステージはすべてメインセッション（対話）で走る — サブエージェントは誰にも質問できず、著者の代わりに決めることは要件の発明になる</text></svg>

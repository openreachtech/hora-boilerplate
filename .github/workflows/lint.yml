name: Node.js CI with ESLint

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # ⚠️ Keep this name fixed. Required status checks are configured per-organization
    # by check name, so renaming the job here silently exempts this repository
    # from the merge gate.
    name: CI Test

    # private repository: self-hosted
    # public repository: github-hosted
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted", "light"]' || '["ubuntu-latest"]') }}

    timeout-minutes: 60

    steps:
      - name: 🛎️ Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ja/en pair check diffs against the PR's base branch, and a
          # shallow checkout cannot resolve a merge base for that.
          fetch-depth: 0

          # ⚠️ Checkout otherwise leaves the token in .git/config for the rest
          # of the job, and no step here reaches a remote: npm ci talks to the
          # registry, and the pair check reads refs this fetch already brought
          # down. What would still reach the token is an install script, which
          # arrives from whatever the lockfile of the branch under test names.
          persist-credentials: false

      - name: 🏗️ Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # ⚠️ The npm cache only pays off where ~/.npm is discarded between jobs.
          # On a persistent [self-hosted] runner it re-ships what is already on disk,
          # adding a measured 2.7 GB and ~2m30s to this step so that the next one,
          # npm ci, can finish in 5s instead of 7s.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: false
          # A floating LTS alias keeps every repository current without a scheduled
          # sweep to bump a pinned major across all of them. Pin a concrete version
          # here only in a repository that genuinely needs one.
          node-version: lts/*

      - name: 🖨️ Print environment
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          echo
          echo "runner: $RUNNER_ENVIRONMENT"
          echo "node  : $(node -v)"
          echo "npm   : $(npm -v)"

      # ⚠️ This gate runs before npm ci, and the order is the point: npm ci puts the
      # vulnerable files on the runner, and the test run then executes them through the
      # real code path. The advisory has to answer before anything is fetched. Auditing
      # first is possible because npm audit resolves the tree from package-lock.json
      # alone and needs no node_modules; skipping a doomed install is a side benefit.
      #
      # ⚠️ When this step fails, check whether npm is answering before reading it as a
      # finding. A 503 from the advisory service exits 1 exactly as an advisory does, and
      # npm does not retry the bulk POST — `--fetch-retries=4` still sends one request.
      # Telling the two apart takes a script that reads `npm audit --json`, and that is
      # worth carrying only while the service is degraded, which is a passing condition.
      - name: 🛡️ npm audit
        run: npm audit

      - name: 📦 Install packages
        run: npm ci

      - name: 🧵 ESLint
        run: npm run lint

      - name: 🌐 Check ja/en doc pairs
        run: npm run lint:docs-pairs
